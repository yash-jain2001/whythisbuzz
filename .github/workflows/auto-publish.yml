name: Auto Publish Trending Articles

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Auto Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: npx tsx scripts/auto-publisher.ts

      # With Vercel ISR, new articles in Supabase are served dynamically on-demand.
      # Trigger Vercel Deploy Hook if configured (optional).
      - name: Trigger Vercel Deploy Hook (Optional)
        env:
          VERCEL_HOOK_URL: ${{ secrets.VERCEL_HOOK_URL || secrets.CLOUDFLARE_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_HOOK_URL" ]; then
            curl --fail --silent --show-error --retry 3 -X POST "$VERCEL_HOOK_URL" || true
          else
            echo "No deploy hook set. Vercel ISR will serve new Supabase articles dynamically."
          fi


