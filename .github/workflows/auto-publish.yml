name: Auto Publish News

on:
  schedule:
    # Runs every 4 hours (e.g. 0, 4, 8, 12, 16, 20)
    - cron: "0 */4 * * *"
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Auto Publisher Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/auto-publisher.ts

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/ scripts/history.json

          # Only commit and push if there are changes
          if git diff --staged --quiet; then
            echo "No new articles generated."
          else
            git commit -m "docs(content): auto-publish trending news articles"
            git push origin HEAD
          fi
