name: Auto Publish Trending Articles

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Auto Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: npx tsx scripts/auto-publisher.ts

      # A new Supabase row is not a public page until Cloudflare builds the
      # static export. Fail the workflow if the deploy hook is missing or
      # fails; silently skipping it causes the sitemap to advertise 404 URLs.
      - name: Trigger and require Cloudflare Pages rebuild
        env:
          CLOUDFLARE_HOOK_URL: ${{ secrets.CLOUDFLARE_HOOK_URL }}
        run: |
          if [ -z "$CLOUDFLARE_HOOK_URL" ]; then
            echo "CLOUDFLARE_HOOK_URL is not configured. Refusing to publish URLs that have not been deployed." >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-all-errors -X POST "$CLOUDFLARE_HOOK_URL"


